name: "CI"

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        timeout-minutes: 10

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 10

      # Uncomment to run the test suite in CI. Provide any required secrets
      # (e.g. BASE_URL, API_TOKEN) via repository/organization secrets.
